<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living Memory Spirit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a14;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .mood-controls {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            gap: 12px;
            z-index: 10;
            flex-wrap: wrap;
            max-width: 600px;
        }

        .mood-btn {
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(10, 10, 20, 0.8);
            color: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-transform: capitalize;
        }

        .mood-btn:hover {
            background: rgba(20, 20, 40, 0.9);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .mood-btn.active {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.6);
            color: white;
        }

        .info {
            position: fixed;
            top: 24px;
            right: 24px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            text-align: right;
            z-index: 10;
            background: rgba(10, 10, 20, 0.6);
            padding: 12px 16px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .info strong {
            color: rgba(255, 255, 255, 0.9);
            display: block;
            margin-bottom: 4px;
        }

        @media (max-width: 768px) {
            .mood-controls {
                bottom: 12px;
                left: 12px;
                right: 12px;
                max-width: calc(100vw - 24px);
            }

            .mood-btn {
                padding: 8px 16px;
                font-size: 12px;
            }

            .info {
                top: 12px;
                right: 12px;
                font-size: 11px;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <canvas id="spiritCanvas"></canvas>
    
    <div class="mood-controls">
        <button class="mood-btn active" data-mood="focused">Focused</button>
        <button class="mood-btn" data-mood="calm">Calm</button>
        <button class="mood-btn" data-mood="excited">Excited</button>
        <button class="mood-btn" data-mood="angry">Angry</button>
        <button class="mood-btn" data-mood="tired">Tired</button>
    </div>

    <div class="info">
        <strong>Living Memory Spirit</strong>
        <div>Select a mood to see the spirit adapt</div>
    </div>

    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec2 position;
        void main() {
            gl_Position = vec4(position, 0.0, 1.0);
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision highp float;
        
        uniform vec2 resolution;
        uniform float time;
        uniform vec3 primaryColor;
        uniform vec3 secondaryColor;
        uniform vec3 coreColor;
        
        // Simple 2D noise function
        float noise(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }
        
        // Smooth noise
        float smoothNoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            
            float a = noise(i);
            float b = noise(i + vec2(1.0, 0.0));
            float c = noise(i + vec2(0.0, 1.0));
            float d = noise(i + vec2(1.0, 1.0));
            
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }
        
        // Fractal Brownian Motion for organic patterns
        float fbm(vec2 p) {
            float value = 0.0;
            float amplitude = 0.5;
            float frequency = 1.0;
            
            for(int i = 0; i < 6; i++) {
                value += amplitude * smoothNoise(p * frequency);
                frequency *= 2.0;
                amplitude *= 0.5;
            }
            
            return value;
        }
        
        // Rotating 2D vector
        vec2 rotate(vec2 v, float angle) {
            float s = sin(angle);
            float c = cos(angle);
            return vec2(v.x * c - v.y * s, v.x * s + v.y * c);
        }
        
        void main() {
            vec2 uv = (gl_FragCoord.xy - resolution * 0.5) / min(resolution.x, resolution.y);
            
            // Breathing animation
            float breathe = sin(time * 0.7) * 0.12 + 0.88;
            uv /= breathe;
            
            float dist = length(uv);
            float angle = atan(uv.y, uv.x);
            
            // Organic membrane wobble with more variation
            float wobbleNoise = fbm(vec2(angle * 4.0 + time * 0.25, time * 0.18));
            float wobble = wobbleNoise * 0.12;
            float membraneRadius = 0.38 + wobble;
            
            // Enhanced core glow with layering
            float core = exp(-dist * 8.0) * 2.0;
            core += exp(-dist * 4.0) * 1.2;
            core += exp(-dist * 2.0) * 0.6;
            
            // Soft membrane edge - more visible
            float membraneEdge = smoothstep(membraneRadius + 0.08, membraneRadius - 0.02, dist);
            membraneEdge *= (1.0 - smoothstep(membraneRadius - 0.02, membraneRadius * 0.7, dist));
            
            // Enhanced internal filaments - neural network style
            vec2 filamentUV = uv;
            float filaments = 0.0;
            
            for(int i = 0; i < 12; i++) {
                float fi = float(i);
                float rotAngle = fi * 0.523599 + time * 0.12; // 30 degrees * i
                vec2 dir = vec2(cos(rotAngle), sin(rotAngle));
                
                // Create curved branching patterns
                vec2 curvedUV = rotate(filamentUV, sin(time * 0.3 + fi) * 0.3);
                float branchNoise = fbm(curvedUV * 5.0 + dir * time * 0.4 + fi * 10.0);
                
                // Draw thin lines along directions
                float lineVal = abs(dot(normalize(uv), dir));
                lineVal = 1.0 - lineVal;
                lineVal = pow(lineVal, 20.0 + branchNoise * 15.0);
                
                // Fade with distance from center
                float fadeOut = smoothstep(membraneRadius * 0.9, membraneRadius * 0.2, dist);
                
                // Create branching effect
                float branches = step(0.5, branchNoise) * lineVal * fadeOut;
                filaments += branches * (0.4 + branchNoise * 0.6);
            }
            
            // Add secondary finer filaments
            for(int i = 0; i < 8; i++) {
                float fi = float(i);
                float rotAngle = fi * 0.785398 + time * 0.08 + 0.4; // Offset from main
                vec2 dir = vec2(cos(rotAngle), sin(rotAngle));
                
                float branchNoise = fbm(uv * 8.0 + dir * time * 0.5 + fi * 5.0);
                float lineVal = abs(dot(normalize(uv), dir));
                lineVal = 1.0 - lineVal;
                lineVal = pow(lineVal, 25.0 + branchNoise * 20.0);
                
                float fadeOut = smoothstep(membraneRadius * 0.85, membraneRadius * 0.3, dist);
                filaments += lineVal * fadeOut * 0.3;
            }
            
            filaments = clamp(filaments, 0.0, 1.5);
            
            // Lightning-like energy flares
            float energyFlow = fbm(uv * 7.0 + time * 0.6);
            float flare = filaments * energyFlow * 0.8;
            flare *= smoothstep(membraneRadius, membraneRadius * 0.2, dist);
            
            // Outer halo - softer and more diffused
            float halo = exp(-dist * 1.8) * 0.4;
            halo += exp(-dist * 3.5) * 0.3;
            halo += exp(-dist * 6.0) * 0.2;
            
            // Enhanced particle wisps
            float wisps = 0.0;
            for(int i = 0; i < 5; i++) {
                float fi = float(i);
                float wispTime = time * (0.35 + fi * 0.05);
                vec2 wispCenter = vec2(
                    sin(wispTime + fi * 2.4) * (0.35 + sin(time * 0.2 + fi) * 0.1),
                    cos(wispTime * 0.8 + fi * 1.9) * (0.35 + cos(time * 0.15 + fi) * 0.1)
                );
                float wispDist = length(uv - wispCenter);
                float wispNoise = fbm(uv * 12.0 + time * 0.5 + fi);
                float wisp = exp(-wispDist * 18.0) * (0.6 + wispNoise * 0.4);
                
                // Only show wisps outside membrane
                wisp *= smoothstep(membraneRadius - 0.05, membraneRadius + 0.15, length(wispCenter));
                wisps += wisp * 0.2;
            }
            
            // Combine all elements with enhanced colors
            vec3 color = vec3(0.0);
            
            // Core (bright white/primary glow) - more intense
            color += coreColor * core * 1.8;
            
            // Membrane edge - more visible
            color += primaryColor * membraneEdge * 1.2;
            color += mix(primaryColor, secondaryColor, 0.5) * membraneEdge * 0.6;
            
            // Internal filaments - prominent neural structure
            color += primaryColor * filaments * 0.9;
            color += secondaryColor * filaments * 0.7;
            
            // Energy flares
            color += primaryColor * flare * 1.5;
            color += coreColor * flare * 0.8;
            
            // Ambient effects
            color += secondaryColor * halo * 0.8;
            color += primaryColor * wisps * 0.9;
            
            // Subtle pulsing - more organic
            float pulse = sin(time * 1.3) * 0.08 + 0.92;
            float pulse2 = sin(time * 2.1 + 1.5) * 0.05 + 0.95;
            color *= pulse * pulse2;
            
            // Vignette for depth
            float vignette = 1.0 - smoothstep(0.5, 1.3, dist);
            color *= mix(0.7, 1.0, vignette);
            
            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <script>
        // Mood color palettes
        const moodPalettes = {
            calm: {
                primary: [0.2, 0.7, 0.8],      // Soft teal
                secondary: [0.3, 0.5, 0.9],    // Light blue
                core: [0.8, 0.95, 1.0]         // Pale cyan
            },
            focused: {
                primary: [0.6, 0.3, 0.95],     // Violet
                secondary: [0.8, 0.4, 0.95],   // Light purple
                core: [0.95, 0.85, 1.0]        // Near white with purple tint
            },
            excited: {
                primary: [1.0, 0.6, 0.2],      // Gold
                secondary: [1.0, 0.8, 0.3],    // Yellow-orange
                core: [1.0, 0.95, 0.85]        // Warm white
            },
            angry: {
                primary: [0.95, 0.2, 0.3],     // Red
                secondary: [0.95, 0.3, 0.6],   // Magenta
                core: [1.0, 0.7, 0.75]         // Pink-white
            },
            tired: {
                primary: [0.4, 0.45, 0.55],    // Desaturated blue-grey
                secondary: [0.5, 0.55, 0.65],  // Light grey-blue
                core: [0.75, 0.78, 0.82]       // Muted white
            }
        };

        // WebGL setup
        const canvas = document.getElementById('spiritCanvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        
        if (!gl) {
            alert('WebGL not supported');
            throw new Error('WebGL not supported');
        }

        // Compile shader
        function compileShader(source, type) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            
            return shader;
        }

        // Create program
        const vertexSource = document.getElementById('vertex-shader').textContent;
        const fragmentSource = document.getElementById('fragment-shader').textContent;
        
        const vertexShader = compileShader(vertexSource, gl.VERTEX_SHADER);
        const fragmentShader = compileShader(fragmentSource, gl.FRAGMENT_SHADER);
        
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error('Program link error:', gl.getProgramInfoLog(program));
        }
        
        gl.useProgram(program);

        // Create full-screen quad
        const positions = new Float32Array([
            -1, -1,
             1, -1,
            -1,  1,
             1,  1
        ]);
        
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
        
        const positionLocation = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        // Get uniform locations
        const resolutionLocation = gl.getUniformLocation(program, 'resolution');
        const timeLocation = gl.getUniformLocation(program, 'time');
        const primaryColorLocation = gl.getUniformLocation(program, 'primaryColor');
        const secondaryColorLocation = gl.getUniformLocation(program, 'secondaryColor');
        const coreColorLocation = gl.getUniformLocation(program, 'coreColor');

        // Animation state
        let currentMood = 'focused';
        let targetColors = moodPalettes[currentMood];
        let currentColors = JSON.parse(JSON.stringify(targetColors));
        let startTime = Date.now();

        // Resize canvas
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        
        window.addEventListener('resize', resize);
        resize();

        // Smooth color interpolation
        function lerpColor(a, b, t) {
            return [
                a[0] + (b[0] - a[0]) * t,
                a[1] + (b[1] - a[1]) * t,
                a[2] + (b[2] - a[2]) * t
            ];
        }

        // Smooth easing
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // Render loop
        let transitionStart = 0;
        const transitionDuration = 1500; // 1.5 seconds

        function render() {
            const now = Date.now();
            const time = (now - startTime) / 1000.0;
            
            // Smooth color transition
            if (now - transitionStart < transitionDuration) {
                const t = easeInOutCubic((now - transitionStart) / transitionDuration);
                currentColors.primary = lerpColor(currentColors.primary, targetColors.primary, t);
                currentColors.secondary = lerpColor(currentColors.secondary, targetColors.secondary, t);
                currentColors.core = lerpColor(currentColors.core, targetColors.core, t);
            } else {
                currentColors = JSON.parse(JSON.stringify(targetColors));
            }
            
            // Set uniforms
            gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
            gl.uniform1f(timeLocation, time);
            gl.uniform3f(primaryColorLocation, ...currentColors.primary);
            gl.uniform3f(secondaryColorLocation, ...currentColors.secondary);
            gl.uniform3f(coreColorLocation, ...currentColors.core);
            
            // Draw
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            
            requestAnimationFrame(render);
        }

        // Mood button controls
        const moodButtons = document.querySelectorAll('.mood-btn');
        
        moodButtons.forEach(button => {
            button.addEventListener('click', () => {
                const mood = button.dataset.mood;
                
                // Update active state
                moodButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                
                // Change mood
                currentMood = mood;
                targetColors = JSON.parse(JSON.stringify(moodPalettes[mood]));
                transitionStart = Date.now();
            });
        });

        // Start animation
        render();
    </script>
</body>
</html>
